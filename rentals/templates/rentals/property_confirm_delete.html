<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Property</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'property_list' %}">Rent System - Owner Dashboard</a>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Confirm Deletion</h4>
                    </div>
                    <div class="card-body text-center">
                        <p class="lead">Are you sure you want to delete property <strong style="color: red;">{{ property.name }}</strong>?</p>
                        <p class="text-muted">This action will remove the property from your list.</p>
                        <form method="post" class="mt-4">
                            {% csrf_token %}
                            <a href="{% url 'property_list' %}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-danger">Yes, Delete Property</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
